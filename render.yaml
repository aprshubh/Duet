services:
  # 1. Duet Go WebSocket Backend
  - type: web
    name: duet-backend
    runtime: go
    rootDir: backend
    plan: free
    buildCommand: go build -o server main.go
    startCommand: ./server
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true

  # 2. Duet React Frontend Static Site
  - type: web
    name: duet-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
